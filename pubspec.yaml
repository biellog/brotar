name: fica_sobrio
description: "Fica Sóbrio — o jogo que te ajuda a ficar sóbrio, um dia de cada vez."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.0
  device_info_plus: ^11.5.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  audioplayers: ^6.7.1
  flutter_local_notifications: ^20.1.0
  workmanager: 0.9.2
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/musica/
    - assets/sons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

# workmanager 0.9.x publicou versões incompatíveis entre si; esta combinação compila.
# (as versões 0.10+ exigem Flutter 3.38)
dependency_overrides:
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2
  workmanager_apple: 0.9.4
