name: CI — testes, site e APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores públicos (Settings → Secrets and variables → Actions → Variables)
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  VITE_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
  VITE_ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
  VITE_ADMOB_TESTING: ${{ vars.ADMOB_TESTING || 'true' }}
  VITE_SITE_URL: ${{ vars.SITE_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: brotar_test, POSTGRES_PASSWORD: brotar_test, POSTGRES_DB: brotar_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
      - name: Testes unitários
        run: npm test
      - name: Testes de banco e segurança (RLS)
        run: npm run test:db
        env: { DATABASE_URL: 'postgresql://brotar_test:brotar_test@localhost:5432/brotar_test' }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testes E2E (inclui XSS e CSP)
        run: npm run test:e2e
      - name: Testes E2E do modo conta (Supabase simulado sobre o Postgres)
        run: npm run test:e2e:supabase
        env: { DATABASE_URL: 'postgresql://brotar_test:brotar_test@localhost:5432/brotar_test' }

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Android SDK (já vem instalado no runner; aceita licenças e instala a plataforma 36)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" > /dev/null
      - run: npm ci && npm run build && npx cap sync android
      - name: Keystore de release (opcional)
        env: { KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK e AAB
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0-dev' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; fi
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: brotar-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: brotar-android, path: out }
      - name: Notas da versão (mensagem da tag)
        env: { TAG: '${{ github.ref_name }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          MSG=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq '.object' | jq -r 'if .type=="tag" then .url else "" end' | xargs -r gh api --jq '.message' 2>/dev/null || true)
          [ -n "$MSG" ] || MSG="Melhorias e correções."
          printf '%s' "$MSG" > notes.txt
      - id: gh
        uses: softprops/action-gh-release@v2
        with:
          files: 'out/**/*.apk'
          body_path: notes.txt
      - name: Registrar versão no Supabase (aviso de atualização no app)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_URL: ${{ vars.UPDATE_URL || steps.gh.outputs.url }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          MANDATORY: ${{ vars.UPDATE_MANDATORY || 'false' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY não configurados: o app não será avisado desta versão."
            exit 0
          fi
          # chaves novas (sb_secret_...) vão só no header apikey; a legada service_role (JWT) também no Authorization
          HEADERS=(-H "apikey: $SERVICE_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal")
          [[ "$SERVICE_KEY" == sb_* ]] || HEADERS+=(-H "Authorization: Bearer $SERVICE_KEY")
          jq -n --rawfile notes notes.txt --arg vn "$VERSION_NAME" --arg url "$RELEASE_URL" \
                --argjson vc "$VERSION_CODE" --argjson m "$MANDATORY" \
                '{platform:"android", version_code:$vc, version_name:$vn, notes:($notes|.[0:1000]), url:$url, mandatory:$m}' \
          | curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/app_releases" "${HEADERS[@]}" --data @-
          echo "Versão $VERSION_NAME (build $VERSION_CODE) registrada: o app vai avisar os usuários."
